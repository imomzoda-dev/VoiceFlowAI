# macOS build of VoiceFlow AI, run in this public repository (GitHub Actions is free for public
# repositories, macOS runners included). The source code stays in the private repository: it is
# checked out with the SOURCE_TOKEN secret (a fine-grained token with read-only access to
# imomzoda-dev/voiceflow-ai-src). Builds Apple Silicon + Intel DMG/ZIP (ad-hoc signed), checks the
# bundles and the self-update packages, starts the packaged app, and attaches the files to the
# release v<version> of this repository.
name: macOS release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.4 (tag v1.0.4 must exist in the source repository and here)'
        required: true

permissions:
  contents: write

concurrency:
  group: mac-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (arm64 + x64)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check the source token
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::The SOURCE_TOKEN secret is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: imomzoda-dev/voiceflow-ai-src
          ref: v${{ inputs.version }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Type check
        working-directory: src
        run: npm run typecheck

      - name: Unit tests
        working-directory: src
        run: npm test

      - name: Build
        working-directory: src
        run: npm run build

      - name: Package (DMG + ZIP, ad-hoc signed)
        working-directory: src
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Check the app bundles
        working-directory: src
        run: |
          set -euo pipefail
          for pair in "mac-arm64:arm64" "mac:x86_64"; do
            DIR="${pair%%:*}"; WANT="${pair##*:}"
            APP="release/$DIR/VoiceFlow AI.app"
            echo "== $APP (want $WANT)"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv "$APP" 2>&1 | grep -E 'Signature=adhoc|Identifier='
            test "$(lipo -archs "$APP/Contents/MacOS/VoiceFlow AI")" = "$WANT" || { echo "wrong arch"; exit 1; }
            NODE="$(find "$APP/Contents/Resources/app.asar.unpacked" -path "*uiohook-napi/prebuilds/darwin-$( [ "$WANT" = x86_64 ] && echo x64 || echo arm64)/*.node" | head -n 1)"
            test -n "$NODE" || { echo "uiohook prebuild missing"; exit 1; }
            lipo -archs "$NODE" | grep -qw "$WANT" || { echo "native module for another arch: $NODE"; exit 1; }
            /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist"
            test -f "$APP/Contents/Resources/app-update.yml" || { echo "app-update.yml missing"; exit 1; }
            test -d "$APP/Contents/Resources/migrations" || { echo "migrations missing"; exit 1; }
          done
          ls -la release/*.dmg release/*.zip release/latest-mac.yml
          for d in release/*.dmg; do hdiutil verify "$d"; done

      # The app updates itself from these ZIPs (electron/services/updates/mac-update.ts): same checks here.
      - name: Check the self-update packages
        working-directory: src
        run: |
          set -euo pipefail
          YML=release/latest-mac.yml
          cat "$YML"
          VERSION="$(sed -n 's/^version: //p' "$YML")"
          for ARCH in arm64 x64; do
            ZIP="release/$(sed -n 's/^  - url: //p' "$YML" | grep -- "-${ARCH}-mac.zip$" | head -n 1)"
            WANT="$(awk -v z="$(basename "$ZIP")" '$0 ~ "url: "z {f=1; next} f && /sha512:/ {print $2; exit}' "$YML")"
            GOT="$(shasum -a 512 "$ZIP" | cut -d' ' -f1 | xxd -r -p | base64)"
            test "$WANT" = "$GOT" || { echo "sha512 mismatch for $ZIP"; exit 1; }
            WORK="$(mktemp -d)"
            /usr/bin/ditto -x -k "$ZIP" "$WORK/new"
            NEW="$(find "$WORK/new" -maxdepth 1 -name '*.app' | head -n 1)"
            test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$NEW/Contents/Info.plist")" = "$VERSION"
            /usr/bin/codesign --verify --deep --strict "$NEW"
            echo "self-update package OK: $ZIP ($VERSION)"
          done

      - name: Packaged app test
        working-directory: src
        run: npx playwright test tests/e2e/packaged.spec.ts

      - name: Attach to release v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd src/release
          ls -la *.dmg *.zip *.blockmap latest-mac.yml
          gh release upload "v${{ inputs.version }}" *.dmg *.zip *.blockmap latest-mac.yml --repo "${{ github.repository }}" --clobber
